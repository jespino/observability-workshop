apiVersion: 1

# Grafana runs in the same Docker Compose project as the three Victoria
# backends, so it reaches them by service name, not localhost. Inside the
# container, localhost is the container.

datasources:
  - name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    access: proxy
    url: http://victorialogs:9428
    jsonData:
      # Module 8.2 replaces this with a real derived field pointing at the
      # Jaeger datasource. Left empty on purpose so there is something to do.
      derivedFields: []

  # VictoriaTraces implements the Jaeger query API, so Grafana's core Jaeger
  # datasource works against it with no plugin.
  - name: VictoriaTraces (Jaeger)
    type: jaeger
    uid: victoriatraces-jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger

  # The Tempo API is experimental, but it unlocks Traces Drilldown.
  - name: VictoriaTraces (Tempo)
    type: tempo
    uid: victoriatraces-tempo
    access: proxy
    url: http://victoriatraces:10428/select/tempo
